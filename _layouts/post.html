---
layout: default
---

<article>
  <header class="post-header">
    <a class="back-link" href="{{ '/' | relative_url }}">cd ..</a>
    <p class="eyebrow">cat {{ page.slug | default: page.title | slugify }}.md</p>
    <h2>{{ page.title }}</h2>
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: site.date_format }}</time>
    {% if page.tags.size > 0 %}
      <ul class="tag-list" aria-label="Tags">
        {% for tag in page.tags %}
          <li>#{{ tag }}</li>
        {% endfor %}
      </ul>
    {% endif %}
  </header>

  <div class="post-content">
  {{ content }}
  </div>
</article>
